name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck gcovr
          sudo gem install ceedling

      - name: Unit tests
        run: ceedling test:all

      - name: Static analysis + MISRA
        run: >
          cppcheck --enable=warning,style,performance,portability --std=c99
          --addon=misra --suppressions-list=misra_suppressions.txt
          --error-exitcode=1 -q src/

      - name: Coverage
        run: ceedling gcov:all